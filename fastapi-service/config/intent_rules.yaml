# 意图路由规则关键词配置（技术债 #5）
#
# IntentRouter 是 LLM 不可用时的降级 fallback 规则匹配。本文件外置原先
# 散落在 IntentRouter.__init__ 的关键词，便于运营调整而无需改代码。
#
# ⚠️ 降级安全硬约束：本文件缺失 / 损坏 / 字段不全时，IntentRouter 会回退
#    到代码内置默认（与本文件初始值一致），降级路径绝不因缺配置崩溃。
#    因此修改本文件只影响"有配置时"的行为；删掉本文件不会让系统挂掉。
#
# 数值打分逻辑（强/中/弱信号加权、阈值）仍在 intent_router.py 中，本文件
# 只外置「关键词清单」，不改判定算法（等价重构）。

# 知识问答关键词（命中 → 倾向 KNOWLEDGE_QA）
knowledge_keywords:
  - 什么是
  - 如何
  - 怎么
  - 为什么
  - 规则
  - 制度
  - 政策
  - 流程
  - 说明
  - 介绍
  - 解释
  - 定义
  - faq
  - 常见问题
  - 帮助
  - 填写
  - 申请
  - 方法
  - 步骤
  # 制度/规定类关键词
  - 截止
  - 截止时间
  - 规定
  - 要求
  - 期限
  - 时限
  - 多久
  - 什么时候
  - 几点
  - 几日
  - 不得
  - 须
  - 应当
  - 必须
  # 类型/分类类关键词
  - 类型
  - 有哪些
  - 哪些类型
  - 分类
  - 种类
  - 有什么类型
  - 分为哪些
  - 包括哪些
  - 有几种

# 工具执行关键词（按工具分组，命中 → 倾向 TOOL_EXECUTION）
tool_keywords:
  query_timesheet:
    # 组合词（高分）
    - 查询工时
    - 我的工时
    - 查看工时
    - 本人工时
    - 工时记录
    # 基础词（中分）
    - 工时
    - 工作时间
    - 加班
    - 考勤
    - 打卡
    - 上班
    - 下班
    # 时间限定
    - 本周工时
    - 本月工时
  query_project:
    # 组合词（高分）
    - 查询项目
    - 项目信息
    - 项目详情
    - 项目成员
    - 项目进度
    - 查看项目
    - 显示项目
    # 基础词（中分）
    - 项目
  compute_statistics:
    # 统计词（高分）
    - 统计
    - 汇总
    - 报表
    - 分析
    - 总计
    - 平均
    - 对比
    - 统计数据
    - 数据分析
    # 组合词
    - 统计部门
    - 统计工时
    - 统计项目
    - 部门统计
    - 项目统计

# 复杂请求指示词（命中 → 倾向 COMPLEX_REQUEST，需任务规划）
